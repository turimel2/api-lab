<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
  <h1>Pokédex</h1>
  </header>

  <main>
  <section id="search-area">
    <label for="search">Search a Pokémon</label>
    <input type="text" id="search" placeholder="e.g. pikachu">
    <button id="search-btn">Search</button>
  </section>
  <section id="results">
  </section>
  </main>

  <footer>
    <p>Data from PokéAPI</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
